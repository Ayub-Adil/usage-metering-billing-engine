services:
  postgres:
    image: postgres:16
    container_name: usage-billing-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: billing_user
      POSTGRES_PASSWORD: billing_password
      POSTGRES_DB: usage_billing
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: .
    container_name: usage-billing-api
    restart: unless-stopped
    environment:
      DATABASE_URL: "postgresql://billing_user:billing_password@postgres:5432/usage_billing"
    ports:
      - "8001:8001"
    depends_on:
      - postgres

volumes:
  postgres_data: